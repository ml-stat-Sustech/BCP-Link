name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: uv sync --locked
      - run: uv run python -m compileall -q src/searcherkit tests
      - run: uv run python -m searcherkit --help
      - run: uv run python -m searcherkit inspect --config-path searcherkit
      - run: uv run pytest -q
